    <!-- Business Logo / Avatar Placeholder -->
    <div class="flex justify-center mb-5">
      
        <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-primary-container via-surface-container-high to-surface-container flex items-center justify-center text-primary shadow-sm border border-outline-variant/30">
          <span class="material-symbols-outlined text-5xl">storefront</span>

    <!-- Business Name & Tagline -->

    <!-- Connect With Us Header & Subtitle -->

        Connect With Us

      <p class="text-xs text-on-surface-variant mt-1.5 leading-relaxed">
        Find us on your favourite platforms.
      </p>
    </div>

    
    <div class="space-y-3.5" id="action-buttons">

      
      
      
      <a
        id="google-review-btn"

      >
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-white">
            <span class="material-symbols-outlined text-xl">star</span>
          </div>
          <span class="text-left font-bold">Google Reviews</span>
        </div>
        <span class="material-symbols-outlined text-[18px] opacity-75 group-hover:translate-x-0.5 transition-transform">open_in_new</span>
      </a>
      
      

      
      
      <a
        id="btn-whatsapp"
        href="https://wa.me/911234567890"
        target="_blank"
        rel="noopener noreferrer"

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-md mx-auto mt-6 text-center text-xs text-on-surface-variant font-mono space-y-1">
    <p>Powered by <a href="/reviewbridge-pages/" class="underline hover:text-on-surface transition-colors font-semibold">ReviewBridge</a></p>
    <p class="text-[10px] opacity-75">Contactless QR &amp; NFC Redirection Hub</p>
  </footer>

  <script>
    function showDemoNotice(el) {
      alert("Demo only — connect your business's actual Google Review link to activate this button.");
    }

    function trackReviewClick(slug) {
      try {
        const endpoint = '/r/' + encodeURIComponent(slug) + '/track-click';
        if (navigator.sendBeacon) {
          navigator.sendBeacon(endpoint);
        } else {
          fetch(endpoint, { method: 'POST', keepalive: true });
        }
      } catch (err) {}
    }
  </script>
